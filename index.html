<style>
:root{
  --paper:#E7E8E2; --card:#F5F5F0; --ink:#181D24; --soft:#5C6672; --faint:#8B939C;
  --rule:#CDD0C8; --hair:#DEE0D9;
  --food:#B23A2E; --music:#7B3FA0; --hoods:#1F6F78;
  --f-disp:"Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column;padding-top:var(--sat)}

/* ---- guide tabs: a line-colour band under each, like platform signage ---- */
#guides{display:flex;gap:0;padding:0 6px;background:var(--paper)}
.gtab{flex:1 1 auto;min-width:0;border:0;background:none;padding:11px 6px 0;text-align:left;font-family:var(--f-disp);
  font-size:15.5px;font-weight:500;color:var(--soft);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtab .band{display:block;height:3px;margin-top:8px;background:var(--g);opacity:.28;border-radius:2px}
.gtab .n{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--faint);margin-left:5px}
.gtab[aria-selected="true"]{color:var(--ink);font-weight:700}
.gtab[aria-selected="true"] .band{opacity:1;height:5px;margin-top:6px}

/* ---- layer chips ---- */
#chips{display:flex;gap:6px;overflow-x:auto;padding:9px 10px 9px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  border-bottom:1px solid var(--rule);background:var(--paper)}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--rule);background:transparent;border-radius:999px;
  padding:6px 12px 6px 9px;font-size:13.5px;color:var(--soft);white-space:nowrap}
.chip .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--card);border-color:var(--ink);color:var(--ink);font-weight:500}
.chip[aria-pressed="false"] .sw{opacity:.35}
.chip.quiet{border-style:dashed;padding-left:12px}
.sw{flex:none;display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c)}

/* ---- stage ---- */
#stage{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}

#map{position:absolute;inset:0;background:#f2f3f0}
.pad{max-width:680px;margin:0 auto;padding:14px 14px 40px}

#mapnote{position:absolute;left:10px;right:54px;top:10px;z-index:3;background:var(--ink);color:#fff;font-size:12.5px;
  padding:8px 11px;border-radius:6px;line-height:1.35;border:0;text-align:left}
#legend{position:absolute;left:10px;bottom:30px;z-index:2;background:rgba(245,245,240,.94);border:1px solid var(--rule);
  border-radius:6px;padding:7px 10px;font-size:11.5px;color:var(--soft);display:grid;gap:4px;max-width:210px}
#legend div{display:flex;align-items:center;gap:7px}
#legend .ln{width:16px;height:0;border-top:2px dashed #9E7B4F}
#legend .lo{width:16px;height:9px;background:rgba(74,112,150,.28)}
#legend .rv{width:16px;height:4px;background:#1F6F78;border-radius:2px}
#fixbar{position:absolute;left:10px;right:10px;bottom:14px;z-index:4;background:var(--ink);color:#fff;border-radius:8px;
  padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#fixbar span{flex:1;min-width:150px}
#fixbar button{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:6px;padding:7px 12px}
#fixbar button.go{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
#cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:4;pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:var(--ink)}
#cross::before{left:16px;top:0;width:2px;height:34px}
#cross::after{top:16px;left:0;height:2px;width:34px}

/* ---- pins: the only colour on the map ---- */
.pin{width:14px;height:14px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pin::after{content:"";position:absolute;inset:-11px}
.pin i{position:absolute;inset:0;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px rgba(24,29,36,.4)}
.pin.diamond i{border-radius:2px;transform:rotate(45deg) scale(.88)}
.pin.approx i{background:#fff;border:3.5px solid var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.95)}
.pin .lab{position:absolute;left:19px;top:50%;transform:translateY(-50%);white-space:nowrap;font:500 11.5px/1.1 var(--f-body);
  color:var(--ink);text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff;display:none;pointer-events:none}
#map[data-z="hi"] .pin .lab,.pin.sel .lab{display:block}
#map[data-z="lo"] .pin i{transform:scale(.62)}
#map[data-z="lo"] .pin.diamond i{transform:rotate(45deg) scale(.56)}
.pin.sel{z-index:6}
.pin.sel i{transform:scale(1.5);box-shadow:0 0 0 2.5px var(--ink)}
.pin.diamond.sel i{transform:rotate(45deg) scale(1.3)}
.pin.sel .lab{font-weight:700;left:24px}
.pin[data-n]::before{content:attr(data-n);position:absolute;left:9px;top:-13px;min-width:16px;height:16px;padding:0 4px;
  border-radius:99px;background:var(--ink);color:#fff;font:700 10.5px/16px var(--f-disp);text-align:center;z-index:2}
.pin.pill{z-index:3}
.pin.pill .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--c);color:#fff;
  font:600 12px/1 var(--f-disp);padding:5px 9px;border-radius:99px;white-space:nowrap;border:1.5px solid #fff;
  box-shadow:0 0 0 1px rgba(24,29,36,.35)}
.pin.pill.sel .pl{box-shadow:0 0 0 2.5px var(--ink)}
.pin.hl{width:22px;height:22px;z-index:7}

.pin.sub{width:9px;height:9px;z-index:1}
.pin.sub i{background:#fff;border:2.5px solid var(--c)}

#map[data-z="mid"] .pin.sub .lab,#map[data-z="hi"] .pin.sub .lab{display:block;font-size:10.5px;color:var(--c);left:13px}

/* ---- bottom sheet ---- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--ink);
  max-height:64%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 18px;box-shadow:0 -6px 22px rgba(24,29,36,.16)}
#sheet .x{position:sticky;float:right;top:0;margin:-4px -6px 0 8px;width:36px;height:36px;border:1px solid var(--rule);border-radius:50%;
  background:var(--card);font-size:19px;line-height:1}
.kind{display:flex;align-items:center;gap:7px;margin:0 0 5px;font-size:12.5px;color:var(--soft)}

.ja{margin:2px 0 0;color:var(--soft);font-size:13.5px}
.facts{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.facts dt{color:var(--faint)}
.facts dd{margin:0}
.shut{color:#A3352A;font-weight:500}
.note{margin:10px 0 0;font-size:14.5px}
.approxbox{margin:12px 0 0;padding:9px 11px;border:1px dashed var(--c,var(--soft));border-radius:6px;font-size:13px;color:var(--soft);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  background:var(--ink);color:#fff;font-weight:500;font-size:14px;line-height:1.2}
.btn.line{background:transparent;color:var(--ink)}
.btn.wide{grid-column:1/-1}
.btn.small{display:inline-block;padding:6px 11px;font-size:13px;border-color:var(--rule)}
.links{margin:12px 0 0;display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px}
.links a,.links button{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
ul.hi{list-style:none;margin:12px 0 0;padding:0}
ul.hi li{padding:9px 0;border-top:1px solid var(--hair);font-size:13.5px}
ul.hi b{font-weight:500}
ul.hi span{display:block;color:var(--soft);font-size:13px}
ul.hi a{font-size:12.5px;color:var(--soft)}
ul.hi li{position:relative;transition:background .4s}
ul.hi li .num{position:absolute;left:0;top:10px;width:20px;height:20px;border-radius:50%;background:var(--hoods);color:#fff;font:700 11px/20px var(--f-disp);text-align:center}

.pinrow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:5px;font-size:12.5px}
.pinrow em{font-style:normal;font-weight:500;color:var(--ink);flex-basis:100%}
.pinrow a,.pinrow button{border:0;background:none;padding:0;color:var(--soft);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.pinrow button[data-act="hl"]{color:var(--hoods);font-weight:500}
.links button{color:inherit}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 6px}

.foot{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap}

#views{display:flex;border-top:1px solid var(--ink);background:var(--paper);padding-bottom:var(--sab)}

  .vtab{flex:none;padding-left:20px;padding-right:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

>Ramen<\/b> is Tabelog's Ramen TOKYO Hyakumeiten 2025, all 100.<\/li>\n<li><b>Okonomiyaki<\/b> is the national Hyakumeiten 2025 filtered to Tokyo, which is 11 shops. The list is dominated by Hiroshima and Osaka.<\/li>\n<li><b>Coffee, sushi and pizza<\/b> are researched picks, not an official ranking. Pizza follows the Tokyo style that starts with Susumu Kakinuma at Seirinkan and Savoy and runs through his apprentices, with the top-ranked Neapolitan shops alongside.<\/li>\n<\/ul>\n<h2>How far to trust it<\/h2>\n<ul>\n<li>Every pin is at the shop's own address, from Tabelog's listing, OpenStreetMap or the street address. If one is ever off, open it and set the exact spot yourself.<\/li>\n<li>Closed days come from the Tabelog lists and only cover regular weekly closures. The researched lists have no hours recorded, so check before you go.<\/li>\n<li>The one-line notes are editorial. Double-check anything you are making a special trip for.<\/li>\n<li>Walking times are straight-line estimates. Rivers and rail cuttings can make a short hop much longer.<\/li>\n<\/ul>\n"},{"id":"music","label":"Music","shape":"diamond","groupBy":"Area","groups":["Koenji","Suidobashi","Shibuya","Shimokitazawa","Shinjuku","Hatagaya","Ekoda","Touring shows"],"cats":[{"id":"venue","label":"Venues","ja":"ライブ","color":"#7B3FA0","src":"From your experimental music guide"},{"id":"records","label":"Record shops","ja":"レコード","color":"#C4327A","src":"From your experimental music guide"}],"places":[{"id":"m-niman","c":"venue","n":"Niman Denatsu (20000V)","j":"二万電圧","s":"Higashi-Koenji","g":"Koenji","d":"The essential Koenji venue for noise, experimental and punk. A small basement room with a long history, and a small sign, so look it up before you go.","la":35.69848,"lo":139.6582},{"id":"m-ufo","c":"venue","n":"UFO Club","j":"UFO CLUB 東高円寺","s":"Higashi-Koenji","g":"Koenji","d":"Psychedelic and experimental rock in a tiny, dark basement.","la":35.69817,"lo":139.65509},{"id":"m-penguin","c":"venue","n":"Penguin House","j":"ペンギンハウス 高円寺","s":"Koenji","g":"Koenji","d":"Small live house for indie and experimental acts.","la":35.70736,"lo":139.64968},{"id":"m-losapson","c":"records","n":"Los Apson?","j":"LOS APSON? 高円寺","s":"Koenji","g":"Koenji","d":"The essential stop. Noise, experimental, ambient and obscure Japanese underground releases, and staff who know the local scene.","la":35.7024,"lo":139.65223},{"id":"m-ftarri","c":"venue","n":"Ftarri","j":"Ftarri 水道橋","s":"Suidobashi","g":"Suidobashi","d":"The main room for onkyo and improvised music, most nights, in a space that is also a shop and label. Reservation required: info@ftarri.com. About ¥2,000 to ¥3,000.","w":"https://www.ftarri.com/","la":35.70361,"lo":139.75563},{"id":"m-www","c":"venue","n":"WWW and WWW X","j":"WWW 渋谷","s":"Shibuya","g":"Shibuya","d":"Sister venues in Udagawacho. WWW is the larger hall; WWW X is a club-sized room. They book GEZAN, Haru Nemuri and experimental acts alongside indie.","la":35.66154,"lo":139.69875},{"id":"m-oeast","c":"venue","n":"Spotify O-EAST and the O venues","j":"Spotify O-EAST","s":"Shibuya","g":"Shibuya","d":"A cluster on Dogenzaka from large to small: O-EAST, O-WEST, O-nest and O-Crest. Chapterhouse plays O-EAST on February 17.","la":35.658729,"lo":139.695619,"ad":"渋谷区道玄坂2-14-8"},{"id":"m-du-shibuya","c":"records","n":"Disk Union Shibuya","j":"ディスクユニオン 渋谷","s":"Shibuya","g":"Shibuya","d":"Several floors split by genre. The avant-garde and Japanese underground sections are strong, and the jazz and prog floors are worth a look. Allow time.","la":35.66091,"lo":139.69808},{"id":"m-face","c":"records","n":"Face Records","j":"Face Records 渋谷","s":"Shibuya","g":"Shibuya","d":"Well-curated used vinyl with a good Japanese section.","la":35.6627,"lo":139.69717},{"id":"m-hmv","c":"records","n":"HMV Record Shop Shibuya","j":"HMV record shop 渋谷","s":"Shibuya","g":"Shibuya","d":"A large selection with a good used section.","la":35.66202,"lo":139.69734},{"id":"m-three","c":"venue","n":"Three","j":"下北沢THREE","s":"Shimokitazawa","g":"Shimokitazawa","d":"Small, focused programming including experimental jazz and improvised music.","la":35.6567,"lo":139.667465,"ad":"世田谷区代沢5-18-1 B1"},{"id":"m-shelter","c":"venue","n":"Shelter","j":"下北沢SHELTER","s":"Shimokitazawa","g":"Shimokitazawa","d":"A long-running punk and hardcore venue with occasional noise shows.","la":35.661472,"lo":139.66954,"ad":"世田谷区北沢2-6-10 仙田ビル B1"},{"id":"m-440","c":"venue","n":"440 (Four Forty)","j":"下北沢440","s":"Shimokitazawa","g":"Shimokitazawa","d":"Small live house with varied indie and experimental bookings.","la":35.65826,"lo":139.66748,"ad":"世田谷区代沢5-29-15 SYビル 1F"},{"id":"m-basement","c":"venue","n":"Basement Bar","j":"下北沢BASEMENT BAR","s":"Shimokitazawa","g":"Shimokitazawa","d":"Indie rock with occasional experimental nights. Same building as Three.","la":35.65672,"lo":139.66758,"ad":"世田谷区代沢5-18-1 カラバッシュビル B1"},{"id":"m-fever","c":"venue","n":"FEVER","j":"新代田FEVER","s":"Shindaita","g":"Shimokitazawa","d":"Live house in Shindaita, one stop from Shimokitazawa on the Inokashira line. Check the February schedule in December and January.","w":"https://www.fever-popo.com/schedule/","la":35.662861,"lo":139.660187,"ad":"世田谷区羽根木1-1-14 新代田ビル 1F"},{"id":"m-flash","c":"records","n":"Flash Disc Ranch","j":"フラッシュ・ディスク・ランチ 下北沢","s":"Shimokitazawa","g":"Shimokitazawa","d":"A good used selection of rock and experimental records.","la":35.66068,"lo":139.66838},{"id":"m-du-shimokita","c":"records","n":"Disk Union Shimokitazawa","j":"ディスクユニオン 下北沢店","s":"Shimokitazawa","g":"Shimokitazawa","d":"Smaller than Shibuya but worth a browse.","la":35.66191,"lo":139.67004},{"id":"m-pitinn","c":"venue","n":"Shinjuku Pit Inn","j":"新宿ピットイン","s":"Shinjuku-sanchome","g":"Shinjuku","d":"Tokyo's best-known jazz club, open since 1965, booking both mainstream and avant-garde jazz. Otomo Yoshihide's New Jazz Quintet has played here. There are usually daytime and evening sessions.","la":35.690599,"lo":139.70737,"ad":"新宿区新宿2-12-4 アコード新宿ビル B1F"},{"id":"m-goldengai","c":"venue","n":"Golden Gai","j":"新宿ゴールデン街","s":"Shinjuku-sanchome","g":"Shinjuku","d":"About 200 tiny bars, many seating fewer than ten people. Some have music themes or DJs. Some charge a cover, and a few prefer regulars.","la":35.69364,"lo":139.70455},{"id":"m-du-shinjuku","c":"records","n":"Disk Union Shinjuku","j":"ディスクユニオン 新宿","s":"Shinjuku","g":"Shinjuku","d":"Another large multi-floor location, with strong jazz and prog floors.","la":35.69078,"lo":139.70268},{"id":"m-forestlimit","c":"venue","n":"Forestlimit","j":"forestlimit 幡ヶ谷","s":"Hatagaya","g":"Hatagaya","d":"Wednesdays are KATO Massacre: harsh noise, onkyo, sound art and performances that fit no category. Electronic and experimental shows on other nights.","la":35.67812,"lo":139.67706},{"id":"m-coconuts","c":"records","n":"Coconuts Disk Ekoda","j":"ココナッツディスク 江古田店","s":"Ekoda","g":"Ekoda","d":"A well-curated selection of experimental, new age, progressive and jazz records, Japanese and international, and less picked over than the Shibuya shops.","la":35.736244,"lo":139.672089,"ad":"練馬区豊玉上1-9-10"},{"id":"m-toyosupit","c":"venue","n":"Toyosu PIT","j":"豊洲PIT","s":"Shin-Toyosu","g":"Touring shows","d":"Large hall on the bay. Public Image Ltd play here on February 8.","la":35.649615,"lo":139.788384,"ad":"江東区豊洲6-1-23"}],"read":"<h2>How to use this guide<\/h2>\n<p>The guide is organized by neighborhood so you can plan days around one area: record shopping in the afternoon, a show in the evening. The artist and listening sections at the end give context for what you will hear.<\/p>\n<p>Most experimental venues are small (20 to 50 people). Shows usually start around 7 to 8pm, and tickets run about ¥2,000 to ¥3,500. Some venues, especially Ftarri, want a reservation. Cash is still the norm at small venues.<\/p>\n<h2>Already announced for February 2027<\/h2>\n<p>As of early November 2026, Tokyo's small experimental venues had not posted February schedules; they usually appear one to two months ahead. Two touring shows fall inside the trip:<\/p>\n<ul>\n<li><b>Public Image Ltd:<\/b> February 8, Toyosu PIT, Tokyo (also February 7, Yokohama BAY HALL).<\/li>\n<li><b>Chapterhouse:<\/b> February 17, Spotify O-EAST, Shibuya.<\/li>\n<\/ul>\n<p>Check Ftarri, 20000V, FEVER, Forestlimit and Pit Inn schedules again in December and January.<\/p>\n<h2>Finding shows<\/h2>\n<ul>\n<li><b>Tokyo Gig Guide<\/b> (tokyogigguide.com): English-language listings that cover experimental, noise and underground shows.<\/li>\n<li><b>Resident Advisor<\/b> (ra.co/events/jp/tokyo): best for electronic and club events.<\/li>\n<li><b>Ftarri<\/b> (ftarri.com): nightly schedule for improvised music. Reservations at info@ftarri.com.<\/li>\n<li><b>Bandcamp:<\/b> tags such as \"tokyo noise\", \"japanese experimental\" and \"onkyo\" for discovering artists and show announcements.<\/li>\n<li><b>Venue social accounts:<\/b> many small venues post schedules on X and Instagram before their websites.<\/li>\n<\/ul>\n<h2>Practical tips<\/h2>\n<ul>\n<li>Doors usually open 30 to 60 minutes before the start time.<\/li>\n<li>Bring cash; many small venues do not take cards.<\/li>\n<li>Expect a one-drink charge of about ¥500 to ¥700.<\/li>\n<li>Last trains run around midnight, so plan the ride home or budget for a taxi.<\/li>\n<li>Recording is generally not allowed without permission.<\/li>\n<\/ul>\n<h2>Koenji: the psychedelic heart of the underground<\/h2>\n<p>Koenji is Tokyo's bohemian neighborhood. Low rents have drawn musicians and counterculture types for decades, and the streets around the station are dense with small live houses, thrift shops and izakayas. It is the center of the noise, psych and punk scenes.<\/p>\n<p><b>Walking route.<\/b> Start at JR Koenji Station and walk the covered shopping arcades, browsing thrift shops and cafes along the way. Visit Los Apson? in the afternoon, then come back after dark for a show. Both 20000V and UFO Club are in basements with small signs, so look them up on a map before you go.<\/p>\n<h2>Suidobashi: onkyo and improvised music<\/h2>\n<p>A quiet neighborhood near Tokyo Dome, Suidobashi is home to Ftarri, the main venue for onkyo (quiet, reductionist electroacoustic improvisation) and the successor to Off Site, the Shinjuku space where the movement took shape in the early 2000s.<\/p>\n<p>Ftarri hosts improvised performances most nights in a small room that is also a shop and label. Regulars include Toshimaru Nakamura (no-input mixing board), Tetuzi Akiyama (guitar), Sachiko M (sine waves from an empty sampler) and Otomo Yoshihide (turntables and guitar), along with a younger generation including suzueri, Fumi Endo and Masamichi Kinoshita.<\/p>\n<p><b>What to expect.<\/b> Quiet, focused performances where silence and the sounds of the room are part of the music. It is the opposite end of the spectrum from Koenji noise and rewards close listening.<\/p>\n<p><b>Shopping.<\/b> Ftarri sells CDs from its own label and related artists, many of which are hard to find elsewhere.<\/p>\n<h2>Shibuya: record hunting and live houses<\/h2>\n<p>Shibuya is the center of Tokyo's music retail. It is more polished than Koenji but essential for records, with several mid-size venues for evening shows.<\/p>\n<p><b>Walking route.<\/b> Leave Shibuya Station by the Hachiko exit and walk up into Udagawacho. Spend the afternoon on the record shops, then catch an evening show at WWW or one of the Dogenzaka venues.<\/p>\n<h2>Shimokitazawa: indie and experimental rock<\/h2>\n<p>Shimokitazawa is Tokyo's indie rock neighborhood: narrow streets full of vintage clothing shops, small live houses and cafes. It is more accessible than Koenji but still books experimental acts.<\/p>\n<h2>Shinjuku: jazz and late nights<\/h2>\n<p>Shinjuku has a long jazz history, and Off Site, the birthplace of onkyo, was nearby. Pit Inn remains the essential stop.<\/p>\n<h2>Hatagaya: Wednesday nights<\/h2>\n<p>A quiet residential area one stop from Shinjuku on the Keio New Line, Hatagaya is home to Forestlimit. Wednesdays are KATO Massacre, a weekly night of harsh noise, onkyo, sound art and performances that fit no category, and one of the best regular experimental nights in Tokyo. The venue also hosts electronic and experimental shows on other nights.<\/p>\n<h2>Ekoda: deep crate digging<\/h2>\n<p>A university neighborhood with one record shop worth the trip: Coconuts Disk Ekoda. Combine it with a visit to Ikebukuro.<\/p>\n<h2>Kyoto side trip<\/h2>\n<p>If you take the shinkansen to Kyoto, the trio Kukangendai runs a venue called 外 (Soto). Their music uses shifting rhythms and odd time signatures, and they have worked with Ryuichi Sakamoto. Check whether anything is scheduled during your visit.<\/p>\n<h2>Artist guide by genre<\/h2>\n<h3>Noise and harsh noise<\/h3>\n<ul>\n<li><b>Merzbow:<\/b> the central figure of Japanese noise, still active and prolific.<\/li>\n<li><b>Incapacitants:<\/b> the duo of Toshiji Mikawa and Fumio Kosakai.<\/li>\n<li><b>Masonna:<\/b> Maso Yamazaki's short, theatrical bursts of harsh noise.<\/li>\n<li><b>Hijokaidan:<\/b> a long-running noise collective.<\/li>\n<li><b>Guilty Connector:<\/b> high-energy harsh noise and a popular live draw.<\/li>\n<li><b>ENDON:<\/b> harsh noise combined with post-metal.<\/li>\n<\/ul>\n<h3>Onkyo, electroacoustic and improvised<\/h3>\n<ul>\n<li><b>Toshimaru Nakamura:<\/b> pioneer of the no-input mixing board and a key onkyo figure. Plays regularly at Ftarri.<\/li>\n<li><b>Sachiko M:<\/b> plays an \"empty sampler\", using only the sine waves and sounds the machine makes on its own.<\/li>\n<li><b>Tetuzi Akiyama:<\/b> guitarist and key onkyo collaborator.<\/li>\n<li><b>Otomo Yoshihide:<\/b> turntablist and guitarist, founder of Ground Zero. Recent albums: Solo Works 1: Guitar and Turntable (2023) and Solo Works 2: Otomo Yoshihide Plays Christian Marclay (2025). Also leads the New Jazz Quintet.<\/li>\n<li><b>suzueri:<\/b> piano, self-made instruments and electronics.<\/li>\n<li><b>Fumi Endo:<\/b> piano.<\/li>\n<li><b>Masamichi Kinoshita:<\/b> electronics and harmonium.<\/li>\n<\/ul>\n<h3>Experimental rock and art punk<\/h3>\n<ul>\n<li><b>GEZAN:<\/b> fast noise punk with a protest streak. They run the Jusangatsu (13th Records) label. Albums: Anochi (with Million Wish Collective), KLUE (2020), Silence Will Speak (2018, recorded by Steve Albini).<\/li>\n<li><b>Haru Nemuri:<\/b> poet-punk mixing J-pop, rap, hardcore and noise. Albums: Haru to Shura (2018), SHUNKA RYOUGEN (2022), ekkolaptómenos (2025).<\/li>\n<li><b>Glans:<\/b> Sapporo band whose 2024 debut came out on GEZAN's label.<\/li>\n<li><b>Melt-Banana:<\/b> noise-rock and grindcore duo of Agata (guitar) and Yasuko O (vocals). Still active.<\/li>\n<li><b>Boris:<\/b> drone, doom and noise rock; prolific and always changing direction.<\/li>\n<\/ul>\n<h3>Electronic and ambient<\/h3>\n<ul>\n<li><b>Sugai Ken:<\/b> sound design drawn from folklore and place, mixing traditional instruments with musique concrète. Albums: On the Quakefish (2016), UkabazUmorezU (2017, RVNG Intl.).<\/li>\n<li><b>Foodman:<\/b> post-footwork with broken rhythms and bursts of noise. Albums: Ez Minzoku (2016), Yasuragi Land (2021, Hyperdub), Worm (2024).<\/li>\n<li><b>Diana Chiaki:<\/b> underground darkwave and techno. Album: Under Control (2024).<\/li>\n<\/ul>\n<h3>Psychedelic, tribal and cosmic<\/h3>\n<ul>\n<li><b>OOIOO:<\/b> YoshimiO's all-female band, built on tribal rhythm, psychedelic guitar and chant. Albums: Gold &amp; Green (2005), TAIGA (2006), Gamel (2014, gamelan-inspired), nijimusi (2020).<\/li>\n<li><b>SAICOBAB:<\/b> YoshimiO with Yoshida Daikiti (sitar), percussion and bass, combining Indian classical forms with Japanese experimental rock. Latest album: NRTYA (2024, Thrill Jockey), plus a 2026 split with TAKAAT.<\/li>\n<li><b>ROVO:<\/b> two drummers, Seiichi Yamamoto (ex-Boredoms) on guitar and Yuji Katsui on violin; long krautrock-style psychedelic jams. Collaborated with Steve Hillage and System 7.<\/li>\n<li><b>Acid Mothers Temple:<\/b> Kawabata Makoto's sprawling collective of extended psychedelic improvisation, releasing several albums a year.<\/li>\n<li><b>Boredoms:<\/b> less active now, but YoshimiO and EYE continue in other projects. Essential: Super Ae (1998) and Vision Creation Newsun (1999).<\/li>\n<\/ul>\n<h3>Turntablism, plunderphonics and sample-based<\/h3>\n<ul>\n<li><b>Otomo Yoshihide and Ground Zero:<\/b> Ground Zero (1990 to 1998) took plunderphonics to an extreme. Revolutionary Pekinese Opera Ver. 1.28 (1996) is the landmark.<\/li>\n<li><b>DJ Krush:<\/b> the pioneer of Japanese turntablism and atmospheric instrumental hip-hop. Classics: Strictly Turntablized (1994), Jaku (2004). Latest: Saisei (2024).<\/li>\n<li><b>DJ Kentaro:<\/b> 2002 DMC World Champion, the first Asian winner. Mixes hip-hop, drum and bass and reggae on Ninja Tune.<\/li>\n<li><b>Cornelius:<\/b> Keigo Oyamada's Fantasma (1997) is a sample-collage landmark. Also Point (2001) and Mellow Waves (2017).<\/li>\n<\/ul>\n<h3>Avant-jazz<\/h3>\n<ul>\n<li><b>Otomo Yoshihide's New Jazz Quintet:<\/b> plays at Shinjuku Pit Inn.<\/li>\n<li><b>SOIL &amp; \"PIMP\" SESSIONS:<\/b> a sextet ranging from bebop to Latin jazz.<\/li>\n<li><b>TRI4TH:<\/b> danceable jazz quintet. Album: GIFT (2023).<\/li>\n<li><b>Shiko Ito and Manabu Kitada:<\/b> accordion and clarinet duo playing improvised compositions. Album: laperirostum.<\/li>\n<li><b>Kukangendai:<\/b> Kyoto trio (see the Kyoto side trip).<\/li>\n<\/ul>\n<h2>Essential listening<\/h2>\n<p>Albums to get to know before you go.<\/p>\n<h3>Noise<\/h3>\n<ul>\n<li>Merzbow, Pulse Demon (1996)<\/li>\n<li>Incapacitants, As Loud As Possible (1995)<\/li>\n<li>Masonna, Inner Mind Mystique (1996)<\/li>\n<\/ul>\n<h3>Onkyo and electroacoustic<\/h3>\n<ul>\n<li>Toshimaru Nakamura, No-Input Mixing Board (2000)<\/li>\n<li>Sachiko M, Sine Wave Solo (1999)<\/li>\n<li>Otomo Yoshihide, Solo Works 1: Guitar and Turntable (2023)<\/li>\n<\/ul>\n<h3>Plunderphonics<\/h3>\n<ul>\n<li>Ground Zero, Revolutionary Pekinese Opera Ver. 1.28 (1996)<\/li>\n<li>Ground Zero, Consume Red (1997)<\/li>\n<\/ul>\n<h3>Experimental rock<\/h3>\n<ul>\n<li>GEZAN, Silence Will Speak (2018)<\/li>\n<li>GEZAN, Anochi<\/li>\n<li>Haru Nemuri, SHUNKA RYOUGEN (2022)<\/li>\n<li>Melt-Banana, Fetch (2013)<\/li>\n<li>Boris, Flood (2000)<\/li>\n<\/ul>\n<h3>Psychedelic and tribal<\/h3>\n<ul>\n<li>Boredoms, Super Ae (1998)<\/li>\n<li>Boredoms, Vision Creation Newsun (1999)<\/li>\n<li>OOIOO, Gold &amp; Green (2005)<\/li>\n<li>OOIOO, Gamel (2014)<\/li>\n<li>SAICOBAB, NRTYA (2024)<\/li>\n<li>Acid Mothers Temple, La Novia (2000)<\/li>\n<\/ul>\n<h3>Electronic and ambient<\/h3>\n<ul>\n<li>Sugai Ken, UkabazUmorezU (2017)<\/li>\n<li>Foodman, Ez Minzoku (2016)<\/li>\n<li>Foodman, Yasuragi Land (2021)<\/li>\n<\/ul>\n<h3>Turntablism and hip-hop<\/h3>\n<ul>\n<li>DJ Krush, Strictly Turntablized (1994)<\/li>\n<li>DJ Krush, Meiso (1995)<\/li>\n<li>DJ Krush, Jaku (2004)<\/li>\n<\/ul>\n<h3>Sample collage<\/h3>\n<ul>\n<li>Cornelius, Fantasma (1997)<\/li>\n<li>Cornelius, Point (2001)<\/li>\n<\/ul>\n<h3>Compilation<\/h3>\n<ul>\n<li>Anthology of Experimental Music from Japan (Unexplained Sounds Group, 2022)<\/li>\n<\/ul>"},{"id":"hoods","label":"Neighborhoods","shape":"pill","groupBy":"Terrain","groups":["Home turf","Chuo line west","Plateau edge","Kanda gorge","North","Sumida banks","East lowland","North-west","South-west","South"],"cats":[{"id":"hood","label":"Neighborhoods","ja":"街","color":"#1F6F78","src":"From your Tokyo on Foot guide"}],"places":[{"id":"h-asagaya","c":"hood","n":"Asagaya & Ogikubo","sn":"Asagaya","g":"Chuo line west","la":35.7048,"lo":139.6363,"d":"Two stops west of Koenji and quieter, more grown-up versions of it. Asagaya has a long jazz-bar tradition and a covered shotengai; Ogikubo is residential, with a serious ramen lineage and some unexpectedly grand pre-war estates tucked into its streets.","hi":[["Pearl Center","Long covered shotengai running south from Asagaya station, still full of everyday shops.",[["Pearl Center",35.7022,139.63641]]],["Laputa Asagaya","Small repertory cinema focused on classic Japanese film.",[["Laputa Asagaya",35.7055,139.63479]]],["Ogikubo ramen","One of the birthplaces of old-school Tokyo shoyu ramen. Harukiya is the classic.",[["Harukiya",35.70509,139.6224]]],["Otaguro Park","Former estate of music critic Otaguro Motoo, with a ginkgo-lined approach and his preserved house."],["B-Pump Ogikubo","One of Tokyo's best-known bouldering gyms, one stop from home.",[["B-Pump Ogikubo",35.70487,139.61873]]]],"pts":[],"area":1},{"id":"h-nishiogi","c":"hood","n":"Nishi-Ogikubo & Kichijoji","sn":"Nishiogi","g":"Chuo line west","la":35.7036,"lo":139.5995,"d":"Nishiogi is famously resistant to redevelopment: no station-front complex, just low-rise streets with dozens of antique and secondhand shops scattered across them. Kichijoji is busier but holds one of the best-preserved post-war market grids in the city right beside the station.","hi":[["Nishiogi antique shops","Pick up a local antiques map and wander. The fun is in the dispersal."],["Harmonica Yokocho","A tight grid of post-war black-market alleys in Kichijoji, now tiny bars and food stalls.",[["Harmonica Yokocho",35.70375,139.57932]]],["Inokashira Park","The source pond of the Kanda River. Start your river-following here.",[["Inokashira Park",35.69891,139.5787]]],["Record shops","A good Kichijoji cluster, including a Disk Union branch."]],"pts":[["Inokashira Park",35.696,139.575]],"area":1},{"id":"h-koganei","c":"hood","n":"Koganei","sn":"Koganei","g":"Chuo line west","la":35.701,"lo":139.5121,"d":"Far west on your own line, and worth the trip for one thing above all: an open-air museum of relocated historic buildings set in a large park. Probably the single best museum in Tokyo for what you care about.","hi":[["Edo-Tokyo Open Air Architectural Museum","Maekawa Kunio's own house, a Showa-era bathhouse, a whole reconstructed shitamachi shop street. Closed Mondays; winter hours end around 4:30.",[["Edo-Tokyo Open Air Architectural Museum",35.71637,139.51274]]],["Koganei Park","The museum sits inside it. The Tamagawa Josui aqueduct runs along one side.",[["Koganei Park",35.71647,139.51961]]]],"pts":[["Open Air Architectural Museum",35.709,139.5205]],"area":1},{"id":"h-kagurazaka","c":"hood","n":"Kagurazaka","sn":"Kagurazaka","g":"Plateau edge","la":35.7038,"lo":139.7402,"d":"A slope street descending from the plateau to the old outer moat of Edo Castle, with a former geisha district folded into its side alleys. Stone-paved lanes, black wooden walls, a lingering French presence, and some of the most satisfying micro-topography in central Tokyo.","hi":[["Hyogo Yokocho & Kakurenbo Yokocho","Stone-paved alleys lined with ryotei.",[["Hyogo Yokocho",35.70245,139.73984],["Kakurenbo Yokocho",35.70195,139.74087]]],["Akagi Shrine","An old shrine reworked by Kengo Kuma.",[["Akagi Shrine",35.70459,139.73603]]],["The outer moat at Iidabashi","The Edo Castle defensive landscape is still legible here.",[["Ushigome-mitsuke gate ruins",35.70001,139.74394]]],["Walk it downhill","From Kagurazaka station to Iidabashi, to feel the slope doing its work."]],"pts":[["Iidabashi",35.702,139.7448]],"area":1},{"id":"h-ochanomizu","c":"hood","n":"Ochanomizu, Jimbocho & Suidobashi","sn":"Ochanomizu","g":"Kanda gorge","la":35.6994,"lo":139.7654,"d":"The Kanda River here runs through an artificial gorge cut through the Hongo plateau in the 1600s, with rail lines stacked over and alongside it. Some of the best infrastructure-layering in Tokyo. Walk south into Jimbocho, the used-book town, and west to Suidobashi.","hi":[["Hijiri-bashi bridge","Look down into the gorge as the Marunouchi subway briefly emerges over the river while JR lines run alongside.",[["Hijiri-bashi",35.69975,139.76552]]],["mAAch ecute Kanda Manseibashi","Shops and cafes built into the restored brick viaduct of a long-closed station, with a platform deck between the tracks.",[["mAAch ecute",35.6972,139.77]]],["Jimbocho bookstores","Well over a hundred secondhand shops, plus historic curry and kissaten culture. Bondy for curry, Sabouru for coffee.",[["Bondy",35.69556,139.75738],["Sabouru",35.69557,139.75868]]],["Nikolai-do & Yushima Seido","A Russian Orthodox cathedral and a Confucian temple, a few minutes apart.",[["Nikolai-do",35.698,139.76552],["Yushima Seido",35.7004,139.76659]]],["Music","Ochanomizu's guitar street and Disk Union branches. Ftarri is in Suidobashi."],["Yushima Tenjin","Fifteen minutes north. Plum festival runs roughly mid-February to early March.",[["Yushima Tenjin",35.70769,139.76805]]]],"pts":[["Suidobashi",35.702,139.7537]],"area":1},{"id":"h-yanesen","c":"hood","n":"Yanaka, Nezu & Sendagi","sn":"Yanesen","g":"Plateau edge","la":35.725,"lo":139.766,"d":"The largest surviving piece of pre-war Tokyo, a temple town that escaped much of the destruction that erased the rest of the lowland. Dense with small temples, wooden houses and narrow lanes, and walkable end to end in an afternoon.","hi":[["Hebi-michi (Snake Road)","A wriggling lane tracing the buried Aizome River. A textbook ankyo.",[["Hebi-michi",35.723,139.7638]]],["Yanaka Cemetery","Huge, peaceful, and a great cut-through.",[["Yanaka Cemetery",35.72437,139.77114]]],["SCAI The Bathhouse","A serious contemporary art gallery in a roughly 200-year-old former sento.",[["SCAI The Bathhouse",35.7218,139.7705]]],["Asakura Museum of Sculpture","A sculptor's house-studio with a water garden and rooftop view.",[["Asakura Museum of Sculpture",35.726841,139.768356]]],["Kayaba Coffee","A 1938 kissaten on a corner of old Yanaka.",[["Kayaba Coffee",35.72115,139.77077]]],["Yanaka Ginza & Yuyake Dandan","The shotengai and the sunset stairway above it.",[["Yanaka Ginza",35.72767,139.76532],["Yuyake Dandan",35.72765,139.76717]]],["Ueno Park museums","Next door: the Tokyo National Museum, and Le Corbusier's National Museum of Western Art facing Maekawa's Tokyo Bunka Kaikan.",[["Tokyo National Museum",35.71904,139.77597],["National Museum of Western Art",35.71555,139.77594]]]],"pts":[["Nezu",35.7204,139.765],["Sendagi",35.7275,139.761]],"area":1},{"id":"h-toden","c":"hood","n":"The Toden Arakawa Line","sn":"Toden line","g":"North","la":35.7527,"lo":139.7383,"d":"Tokyo's last surviving regular streetcar line, a single-car tram threading through working-class northern neighborhoods most visitors never see. Ride it, hop off, walk a stretch, ride again.","hi":[["Joyful Minowa","A long covered shotengai at the eastern terminus. Genuinely local.",[["Joyful Minowa",35.73333,139.7905]]],["Asukayama Park","Hilltop park in Oji, reached by a tiny free monorail.",[["Asukayama Park",35.75034,139.73909]]],["Paper Museum","Industrial history of Japanese papermaking, in Oji.",[["Paper Museum",35.74987,139.73868]]],["Otonashi Shinsui Park","A small river valley landscaped along an old channel of the Shakujii River.",[["Otonashi Shinsui Park",35.75266,139.73614]]],["Akabane","Two stops north of Oji on JR. A legendary working-class drinking district where some standing bars open in the morning.",[["Akabane 1-ban-gai",35.78146,139.72007]]]],"pts":[["Minowabashi",35.7275,139.79],["Waseda",35.706,139.7195]],"area":1},{"id":"h-kitasenju","c":"hood","n":"Kitasenju","sn":"Kitasenju","g":"North","la":35.7497,"lo":139.805,"d":"The first post town on the old Nikko and Oshu highways, sitting on a near-island between the Arakawa and the Sumida. The old highway alignment survives as a shotengai, and the station's west side is a maze of izakaya alleys.","hi":[["Shukuba-machi-dori","The old post-town main street, with a few surviving merchant buildings.",[["Shukuba-machi-dori",35.7522,139.8035]]],["Nomiya Yokocho","Dense, unpretentious drinking lanes off the west exit."],["Senju Ohashi","Where Basho set out on The Narrow Road to the Deep North in 1689.",[["Senju Ohashi",35.7394,139.7975]]],["Sento","The area is known for grand, temple-roofed bathhouses like Daikoku-yu.",[["Daikoku-yu",35.753597,139.799927]]]],"pts":[["Senju Ohashi",35.744,139.801]],"area":1},{"id":"h-kuramae","c":"hood","n":"Kuramae, Asakusabashi & Ryogoku","sn":"Kuramae","g":"Sumida banks","la":35.706,"lo":139.792,"d":"Kuramae is named for the shogunate's rice warehouses and is now a makers' district of small workshops, stationers and coffee roasters. Cross the river to Ryogoku, the sumo town, which also holds two of the best museums for understanding Tokyo itself.","hi":[["Kakimori","Custom-built notebooks and house-mixed inks, in Kuramae.",[["Kakimori",35.70317,139.78568]]],["Asakusabashi wholesale streets","Beads, dolls, craft and packaging supplies."],["Kappabashi Dogu-gai","A short walk north: the restaurant-supply street. Knives, lacquer, plastic food samples.",[["Kappabashi Dogu-gai",35.71425,139.78889]]],["Sumida River bridges","The post-1923 reconstruction bridges are each a different design, several designated cultural properties. The Sumida River Walk footbridge leads to Tokyo Mizumachi, shops built under the rail viaduct."],["Edo-Tokyo Museum","Reopened 31 March 2026 after a four-year renovation, inside Kiyonori Kikutake's Metabolist building. Full-scale reconstructions and big city models.",[["Edo-Tokyo Museum",35.69645,139.79608]]],["Sumida Hokusai Museum","Kazuyo Sejima's faceted aluminium building.",[["Sumida Hokusai Museum",35.69638,139.80047]]],["Yokoamicho Park","Memorial hall and museum for the 1923 earthquake and the 1945 air raids. Sobering, and essential context for the whole east side.",[["Yokoamicho Park",35.69951,139.79642]]]],"pts":[["Asakusabashi",35.699,139.786],["Ryogoku",35.696,139.793]],"area":1},{"id":"h-kyojima","c":"hood","n":"Kyojima & Mukojima","sn":"Kyojima","g":"East lowland","la":35.715,"lo":139.818,"d":"North of the Skytree, and a genuine urban-geography treasure: Kyojima largely escaped the fires of both 1923 and 1945, so its irregular pre-modern street pattern and wooden nagaya row houses survive. Quiet, residential, and rewarding to walk aimlessly.","hi":[["The roji of Kyojima","Narrow lanes between old nagaya, some barely shoulder-width."],["Hatonomachi-dori shotengai","A winding old street that follows a pre-modern path.",[["Hatonomachi-dori",35.71964,139.81253]]],["Kira Kira Tachibana shotengai","An unglamorous, very local covered market street.",[["Kira Kira Tachibana",35.71313,139.82309]]],["Mukojima Hyakkaen","An Edo-period flower garden, with plum trees in bloom in February.",[["Mukojima Hyakkaen",35.72425,139.81555]]],["Chomeiji sakura mochi","A shop selling the same sweet by the Sumida since the early 1700s.",[["Chomeiji (sakura mochi next door)",35.71785,139.80901]]],["Use the Skytree as a compass","Not as a destination."]],"pts":[["Mukojima",35.717,139.806],["Hyakkaen",35.7275,139.814]],"area":1},{"id":"h-fukagawa","c":"hood","n":"Kiyosumi-Shirakawa & Monzen-Nakacho","sn":"Fukagawa","g":"East lowland","la":35.681,"lo":139.8,"d":"Edo-era reclaimed land laid out on a canal grid, now mixing old shitamachi life with warehouse-conversion coffee roasters and galleries. Monzen-Nakacho, just south, is the temple-and-shrine side, with great standing bars.","hi":[["Museum of Contemporary Art Tokyo","The city's major contemporary art museum.",[["Museum of Contemporary Art Tokyo",35.67978,139.80879]]],["Fukagawa Edo Museum","A life-size reconstruction of an 1840s Fukagawa street, with lighting that cycles from dawn to dusk. Closed 2nd and 4th Mondays.",[["Fukagawa Edo Museum",35.68109,139.80078]]],["Kiyosumi Garden","A Meiji-era stroll garden with stepping stones across the pond.",[["Kiyosumi Garden",35.67998,139.79779]]],["Fukagawa Fudo-do","A temple whose facade is covered in Sanskrit mantras, with daily fire rituals.",[["Fukagawa Fudo-do",35.67302,139.79828]]],["Fukagawa-meshi","Clam rice. The local dish."],["The canals","Walk the Onagi and Sendaibori channels for a sense of the working waterways."]],"pts":[["Monzen-Nakacho",35.671,139.797]],"area":1},{"id":"h-tsukishima","c":"hood","n":"Tsukishima & Tsukuda","sn":"Tsukishima","g":"East lowland","la":35.665,"lo":139.783,"d":"Tsukishima is 1890s landfill; Tsukuda at its tip is a fishing village founded by fishermen from Osaka in the early Edo period. The result is the starkest old-new juxtaposition in Tokyo: tiny wooden houses and alley shrines in the literal shadow of fifty-storey towers.","hi":[["Tsukuda's back lanes","Go early and quiet. Sumiyoshi Shrine anchors them.",[["Sumiyoshi Shrine",35.668064,139.782959]]],["Tsukudani shops","The preserved-fish condiment is named after this village.",[["Tenyasu (tsukudani)",35.6676,139.78226]]],["Monja Street","Tsukishima's monjayaki strip. Best with a group, or on a cold night.",[["Monja Street",35.663017,139.781174]]],["Kachidoki Bridge","A former drawbridge, now a designated cultural property. Pair with a morning at the Tsukiji outer market.",[["Kachidoki Bridge",35.6622,139.77481]]]],"pts":[["Tsukuda",35.668,139.7855]],"area":1},{"id":"h-okubo","c":"hood","n":"Shin-Okubo, Okubo & Takadanobaba","sn":"Okubo","g":"North-west","la":35.7013,"lo":139.7,"d":"Tokyo's most multiethnic corridor. Skip the K-pop main drag and explore the side streets, where the city's newer immigrant communities have built out their own food geography.","hi":[["Islam Yokocho","A short lane of halal groceries and South Asian eateries in Okubo."],["Okubo back streets","Nepali, Bangladeshi and Vietnamese restaurants scattered through them."],["Little Yangon","Tokyo's Burmese hub in Takadanobaba, with several restaurants and shops concentrated in a single building near the station."],["The Kanda River","Runs through Takadanobaba here too. A good bridge between entries."]],"pts":[["Okubo",35.701,139.697],["Takadanobaba",35.7126,139.7038]],"area":1},{"id":"h-shimokita","c":"hood","n":"Shimokitazawa & Shindaita","sn":"Shimokitazawa","g":"South-west","la":35.6613,"lo":139.668,"d":"A hillside tangle of alleys with used clothing, records and a dozen tiny theatres. The big urban story: when the Odakyu line went underground, the old surface track bed became a 1.7 km linear development, a living case study in rail-to-trail urbanism.","hi":[["Bonus Track & Reload","Small-scale, low-rise retail built on the former tracks.",[["Bonus Track",35.65936,139.66418],["Reload",35.66311,139.66966]]],["Record shops","Flash Disc Ranch, and a strong Disk Union presence."],["Honda Theater","Anchor of the small-theatre cluster. Shimokita is Tokyo's fringe-theatre town.",[["Honda Theater",35.66171,139.66847]]],["Hanegi Park plum festival","Roughly mid-February to early March, walkable from the station.",[["Hanegi Park",35.65854,139.65534]]],["FEVER","In Shindaita, one stop away on the Inokashira line.",[["FEVER",35.662861,139.660187]]]],"pts":[["Hanegi Park",35.654,139.657]],"area":1},{"id":"h-sancha","c":"hood","n":"Sangenjaya & the Setagaya Line","sn":"Sangenjaya","g":"South-west","la":35.6434,"lo":139.669,"d":"Sangenjaya's Sankaku Chitai, the triangle zone, is a dense wedge of bar alleys between two major roads. From there a two-car tram line wanders through residential Setagaya with a few genuinely odd stops.","hi":[["Sankaku Chitai","Lose yourself in the wedge between Setagaya-dori and Tamagawa-dori."],["Carrot Tower observation lobby","Free, high, and the quickest way to understand the surrounding sprawl.",[["Carrot Tower",35.64375,139.66922]]],["Meguro Sky Garden","A park built on top of a spiralling expressway interchange, at Ikejiri-Ohashi. Peak urban-geography weirdness.",[["Meguro Sky Garden",35.65099,139.6883]]],["Setagaya Line stops","Setagaya Daikan Yashiki, an Edo-era magistrate's residence, and Gotokuji, the maneki-neko temple.",[["Setagaya Daikan Yashiki",35.6414,139.64766],["Gotokuji",35.6485,139.6473]]],["Kitazawa River greenway","A buried-river path running up from Ikejiri toward Shimokita."]],"pts":[["Ikejiri-Ohashi",35.65,139.683]],"area":1},{"id":"h-meguro","c":"hood","n":"Meguro & Shirokanedai","sn":"Meguro","g":"South","la":35.6339,"lo":139.7157,"d":"Plateau-edge neighborhoods with steep slopes, old estates, and a couple of museums you won't find anywhere else. A good half-day that bounces between the sublime and the bizarre.","hi":[["Meguro Parasitological Museum","Free, one small building, jars of parasites, and a nearly nine-metre tapeworm. Memorably absurd.",[["Meguro Parasitological Museum",35.6317,139.70667]]],["Tokyo Metropolitan Teien Art Museum","A 1933 Art Deco prince's residence with Lalique glass doors, used as a museum.",[["Teien Art Museum",35.63684,139.71928]]],["Institute for Nature Study","A surviving fragment of the old Musashino forest in the middle of the city.",[["Institute for Nature Study",35.63594,139.72129]]],["Gyoninzaka & Daienji","A steep historic slope lined with hundreds of weathered rakan statues.",[["Gyoninzaka",35.6331,139.71376],["Daienji",35.6328,139.7137]]],["Meguro River","Walk it in winter, without the cherry-blossom crowds."]],"pts":[["Shirokanedai",35.638,139.727]],"area":1},{"id":"h-home","c":"hood","n":"Koenji & Nakano","sn":"Koenji","g":"Home turf","la":35.7056,"lo":139.6497,"d":"Your base. You'll know these intimately by the end, but a few pointers for the first week.","hi":[["Momozono-gawa greenway","Your nearest buried river. It winds through Koenji and Nakano, cutting across the street grid."],["Under-track alleys","Along the Chuo line between Koenji and Asagaya."],["Nakano Broadway","Go for the upper floors rather than the anime shops: tiny specialist stores for vintage watches, records and obscure collectibles.",[["Nakano Broadway",35.70924,139.66569]]],["20000V","Essential for noise, in Koenji.",[["20000V",35.69848,139.6582]]],["Los Apson?","Record shop, Koenji.",[["Los Apson?",35.7024,139.65223]]]],"pts":[["Nakano",35.7056,139.6657]],"area":1},{"id":"h-zenpukuji","c":"hood","n":"Zenpukuji River valley","sn":"Zenpukuji","g":"Chuo line west","la":35.6931,"lo":139.62839,"d":"A river valley that was too wet to build on, so it stayed green. The old paddy floor along the water is now park, the wooded slope above it held pre-war villas, and the dry terrace beyond has been settled for two thousand years. The standard walk is about 4.7 km, roughly an hour: from Ogikubo station past Otaguro Park and Kadokawa Garden, down to the river, then east past Omiya Hachimangu to Wadabori Park. Tekigaiso is a short detour near the start.","hi":[["Zenpukuji River","Open, not buried: about 10.5 km from Zenpukuji Pond to the Kanda River. The middle 4.2 km is lined by the Zenpukuji River green space and Wadabori Park. It overflowed in the downpour of September 2005, and the parks now double as flood storage."],["Tekigaiso","Fumimaro Konoe's villa, built in 1927 on the south-facing slope above the river. Site of the 1940 Ogikubo Conference and of his death in 1945. Reopened in December 2024: 9:00 to 17:00, closed Wednesdays, ¥300.",[["Tekigaiso",35.69858,139.6223]]],["Kadokawa Garden","Former home of the founder of the publisher Kadokawa Shoten, on the same rise as Tekigaiso. Haiku displays and a tea room.",[["Kadokawa Garden",35.69881,139.62474]]],["Otaguro Park","Where the walk starts: the music critic Motoo Otaguro's former estate, a few minutes south of Ogikubo station.",[["Otaguro Park",35.70086,139.6247]]],["Omiya Hachimangu","Shrine on the terrace south of the river. The high ground beside it held late Yayoi burial mounds, probably a village chief's. Known for a winter-blooming cherry.",[["Omiya Hachimangu",35.68239,139.64115]]],["Wadabori Park","Downstream end of the walk: a pond made around 1960 by reshaping the river, red clay cliffs, and kingfishers year-round.",[["Wadabori Park",35.6866,139.64269]]]],"pts":[["Zenpukuji Pond (source)",35.715,139.5915]],"area":1}],"read":"<p>Eighteen neighborhoods with a strong sense of place, legible history and good walking, arranged by terrain rather than by guidebook. On the map, the blue-grey wash is low ground and the dashed brown line is roughly where the plateau ends. Both are drawn schematically for orientation, not to survey accuracy.<\/p><h2>Reading the city: a few lenses to bring with you<\/h2>\n<p><b>Plateau vs. lowland.<\/b> Tokyo is split between the <i>Yamanote<\/i> (the hilly western plateau, fingers of the Musashino terrace) and the <i>Shitamachi<\/i> (the flat, river-and-canal lowlands to the east). The seam between them is marked by <i>saka<\/i>, named slopes, many with small signposts explaining the name's origin. Once you notice them, you'll feel the city's topography under your feet everywhere.<\/p>\n<p><b>Ankyo (buried rivers).<\/b> Dozens of Tokyo's small rivers were culverted and turned into narrow, winding greenways. The tell is a sinuous path cutting through an otherwise rectilinear block pattern, often lined with old sento and shops that once faced the water. You have one at home: the Momozono-gawa greenway through Koenji and Nakano.<\/p>\n<p><b>Follow the Kanda River.<\/b> It rises at Inokashira Pond in Kichijoji and runs east through Takadanobaba and the Ochanomizu gorge before meeting the Sumida near Ryogoku. Several entries below sit on it, and it's a nice through-line for the whole trip.<\/p>\n<p><b>Shotengai and yokocho.<\/b> Covered shopping streets and narrow alley clusters are the civic cores of most neighborhoods. The healthiest ones tell you a neighborhood is still lived in, not just visited.<\/p>\n<p><b>Why the east looks the way it does.<\/b> The 1923 Great Kanto Earthquake fires and the 1945 firebombing leveled most of the Shitamachi twice. The few pockets that survived (Yanaka, Kyojima, bits of Tsukuda) are precious precisely because of that.<\/p><h2>Other Worthwhile Stops<\/h2>\n<ul>\n<li><b>National Film Archive of Japan<\/b> (Kyobashi): exhibitions on Japanese film history plus screenings<\/li>\n<li><b>Tokyo National Museum<\/b> (Ueno): pair with a Yanesen day rather than making a trip of it<\/li>\n<\/ul><h2>February Notes<\/h2>\n<ul>\n<li><b>Plum season<\/b> runs roughly mid-February into March: Yushima Tenjin, Hanegi Park, Mukojima Hyakkaen<\/li>\n<li><b>Setsubun<\/b> is February 3, with bean-throwing ceremonies at temples citywide<\/li>\n<li>Cold, dry, clear days make for great walking, but <b>sunset is around 5:15–5:40 pm<\/b>; do the shitamachi walks in the morning and save the alleys for evening<\/li>\n<li>Many museums close on <b>Mondays<\/b> and run shorter winter hours<\/li>\n<\/ul><h2>For Background Reading &amp; Watching<\/h2>\n<ul>\n<li><b>Jinnai Hidenobu, <i>Tokyo: A Spatial Anthropology<\/b><\/i> (UC Press): the classic on how Edo's urban structure persists in modern Tokyo<\/li>\n<li><b>Atelier Bow-Wow, <i>Made in Tokyo<\/b><\/i>: a field guide to the city's weird hybrid buildings (a gas station under a rooftop apartment, etc.)<\/li>\n<li><b><i>Bura Tamori<\/i><\/b> (NHK): comedian Tamori walks Japanese cities reading the topography, geology, and history; some episodes circulate with subtitles<\/li>\n<\/ul>"}],"overlay":{"lines":[{"id":"momozono","c":"hood","n":"Momozono-gawa greenway","j":"桃園川緑道","p":"h-home","coords":[[139.64096,35.70515],[139.64117,35.70498],[139.6415,35.70486],[139.64247,35.7043],[139.64255,35.7042],[139.64262,35.70404],[139.64275,35.70396],[139.64285,35.70392],[139.6434,35.70381],[139.64515,35.70355],[139.64837,35.70297],[139.64861,35.70289],[139.64864,35.70291],[139.65253,35.70218],[139.65289,35.70213],[139.65473,35.70179],[139.65486,35.70174],[139.65822,35.70113],[139.66402,35.70123],[139.66479,35.70126],[139.66502,35.7013],[139.66505,35.70129],[139.66509,35.70132],[139.66541,35.7014],[139.66552,35.70146],[139.6659,35.70217],[139.6664,35.70278],[139.66646,35.70281],[139.66658,35.70283],[139.67025,35.70238],[139.67052,35.70225],[139.67092,35.70197],[139.67119,35.70187],[139.67149,35.70178],[139.67415,35.70171],[139.67616,35.70135],[139.6765,35.70119],[139.67667,35.70115],[139.67699,35.70119],[139.67741,35.70119],[139.67763,35.70118],[139.67816,35.70109],[139.6787,35.70099],[139.67935,35.70074],[139.68041,35.70042],[139.6806,35.7004] const ST = DATA.stations, GUIDES = DATA.guides;
const GCOLOR = {food:"var(--food)", music:"var(--music)", hoods:"var(--hoods)"};
const P = {}, CAT = {}, GUIDE = {};
GUIDES.forEach(g => {
  GUIDE[g.id] = g;
  g.cats.forEach(c => { c.G = g; CAT[c.id] = c; });
  g.places.forEach(p => { p.G = g; p.C = CAT[p.c]; P[p.id] = p; });
});
const HL = {};                          // neighborhood id -> its highlight pins
GUIDES.forEach(g => g.places.forEach(p => {
  if (!p.hi) return;
  let num = 0;
  p.hi.forEach((x, k) => {
    if (!x[2] || !x[2].length) return;
    num++;
    x[2].forEach((q, j) => {
      const hp = {id:p.id + "~" + k + "~" + j, c:p.c, n:q[0], la:q[1], lo:q[2], d:x[1], g:p.n, hl:p.id, num:num, row:k, ht:x[0], G:g, C:p.C};
      P[hp.id] = hp; (HL[p.id] = HL[p.id] || []).push(hp);
    });
  });
}));
const VIEWS = [["map","Map"],["list","List"],["near","Near me"],["plan","Plan"],["read","Read"]];

const TOKYO_DAY = (() => { try { return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"})).getDay(); } catch(e){ return new Date().getDay(); } })();

const $ = s => document.querySelector(s);

const enc = encodeURIComponent;
const store = {

  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

if (!GUIDE[st.guide]) st.guide = GUIDES[0].id;
if (!VIEWS.some(v => v[0] === st.view)) st.view = "map";
st.on = (st.on || []).filter(id => CAT[id]);
st.q = "";

const pos = p => fixes[p.id] || [p.la, p.lo];
const isApprox = p => !!p.x && !fixes[p.id];
const shapeOf = p => p.G.shape;
function swatch(p){ return '<span class="sw ' + (shapeOf(p) === "dot" ? "" : shapeOf(p)) + (isApprox(p) ? " hollow" : "") + '" style="--c:' + p.C.color + '"></span>'; }
function closedTxt(p){
  if (p.nh) return "Hours not recorded. Check before you go.";
  if (!p.cl) return "";
  if (!p.cl.length) return p.h ? "Closed public holidays" : "No regular closing day listed";
  return "Closed " + p.cl.map(d => DAY[d]).join(", ") + (p.h ? " and public holidays" : "");
}
const shutToday = p => !!(p.cl && p.cl.includes(TOKYO_DAY));
function stationTxt(p){ const s = ST[p.s]; return s ? p.s + " " + s.ja : ""; }
function metres(a, b, c, d){
  const R = 6371000, t = Math.PI/180, dp = (c-a)*t, dl = (d-b)*t;
  const x = Math.sin(dp/2)**2 + Math.cos(a*t)*Math.cos(c*t)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function walkTxt(m){
  if (m < 90) return ["Here", ""];
  if (m > 3500) return [(m/1000).toFixed(1) + " km", "away"];
  return [Math.max(1, Math.round(m/80)) + " min", "walk"];
}
function query(p){                      // what to type into a maps app to find this place by name
  if (p.G.id === "food"){ const s = ST[p.s]; return (p.j || p.n) + (s ? " " + s.ja + "駅" : ""); }
  return p.j || p.n;
}
function stopParam(p){ const a = pos(p); return (isApprox(p) && !p.area) ? query(p) : a[0] + "," + a[1]; }
function googleUrl(p){
  if (isApprox(p) && !p.area) return "https://www.google.com/maps/search/?api=1&query=" + enc(query(p));
  const a = pos(p); return "https://www.google.com/maps/dir/?api=1&destination=" + a[0] + "," + a[1];
}
function appleUrl(p){
  const a = pos(p);
  if (isApprox(p) && !p.area) return "https://maps.apple.com/?q=" + enc(query(p)) + "&near=" + a[0] + "," + a[1];
  return "https://maps.apple.com/?daddr=" + a[0] + "," + a[1];
}
const lookupUrl = p => "https://www.google.com/maps/search/?api=1&query=" + enc(query(p));
function routeUrl(ids){
  const stops = ids.map(id => stopParam(P[id]));
  let u = "https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=" + enc(stops[stops.length-1]);
  if (stops.length > 1) u += "&waypoints=" + stops.slice(0, -1).map(enc).join("%7C");
  return u;
}
function visiblePlaces(guideId){        // places on switched-on layers (optionally one guide)
  const out = [];
  GUIDES.forEach(g => { if (guideId && g.id !== guideId) return; g.places.forEach(p => { if (st.on.includes(p.c)) out.push(p); }); });
  return out;
}
const hlOf = places => places.flatMap(p => HL[p.id] || []);   // highlight pins belonging to these places

/* ---------------- top: guides and layer chips ---------------- */
function renderTop(){
  $("#guides").innerHTML = GUIDES.map(g => {
    const n = g.cats.filter(c => st.on.includes(c.id)).length;
    return '<button class="gtab" role="tab" data-act="guide" data-id="' + g.id + '" aria-selected="' + (g.id === st.guide) + '" style="--g:' + (GCOLOR[g.id] || g.cats[0].color) + '">' +
      esc(g.label) + (n ? '<span class="n">' + n + " on</span>" : "") + '<span class="band"></span></button>';
  }).join("");
  const g = GUIDE[st.guide];
  let h = g.cats.map(c => {
    const n = g.places.filter(p => p.c === c.id).length;
    return '<button class="chip" data-act="layer" data-id="' + c.id + '" aria-pressed="' + st.on.includes(c.id) + '">' +
      '<span class="sw ' + (g.shape === "dot" ? "" : g.shape) + '" style="--c:' + c.color + '"></span>' + esc(c.label) + '<span class="n">' + n + "</span></button>";
  }).join("");
  if (g.cats.length > 2){
    const all = g.cats.every(c => st.on.includes(c.id));

  }

  $("#views").innerHTML = VIEWS.map(v => '<button class="vtab" role="tab" data-act="view" data-id="' + v[0] + '" aria-selected="' + (v[0] === st.view) + '">' +
    v[1] + (v[0] === "plan" && plan.length ? '<span class="n">' + plan.length + "</span>" : "") + "</button>").join("");
  document.body.dataset.view = st.view;
