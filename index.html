/* ---------------- map ---------------- */
let map = null, baseOK = false, fallbackOn = false, geoCtl = null;
const markers = new Map();
const FB_LAYERS = ["fb-wards","fb-rail","fb-rivers"];
const mapNote = t => { const n = $("#mapnote"); n.textContent = t || ""; n.hidden = !t; };

function routesGeo(){                  // only the routes whose layer is switched on
  return {type:"FeatureCollection", features:(DATA.overlay.lines || []).filter(l => st.on.includes(l.c)).map(l => ({type:"Feature",
    properties:{id:l.id, c:l.c, label:l.n + "  " + (l.j || "")}, geometry:{type:"LineString", coordinates:l.coords}}))};
}
function planGeo(){
  const c = plan.map(id => { const a = pos(P[id]); return [a[1], a[0]]; });
  return {type:"FeatureCollection", features: c.length > 1 ? [{type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:c}}] : []};
}
function buildStyle(){
  const s = JSON.parse(JSON.stringify(STYLE));
  const line = (coords) => ({type:"Feature", properties:{}, geometry:{type:"MultiLineString", coordinates:coords}});
  const hoodOn = st.on.includes("hood") ? "visible" : "none";
  s.sources.low = {type:"geojson", data:{type:"Feature", properties:{}, geometry:{type:"Polygon", coordinates:[DATA.overlay.low]}}};
  s.sources.scarp = {type:"geojson", data:{type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:DATA.overlay.scarp}}};
  s.sources.plan = {type:"geojson", data:planGeo()};
  s.sources.routes = {type:"geojson", data:routesGeo()};
  s.sources.fbw = {type:"geojson", data:line(DATA.fallback.wards)};
  s.sources.fbr = {type:"geojson", data:line(DATA.fallback.rail)};
  s.sources.fbv = {type:"geojson", data:line(DATA.fallback.rivers)};
  const mine = [
    {id:"fb-wards", type:"line", source:"fbw", layout:{visibility:"none"}, paint:{"line-color":"#b9bdb6","line-width":1}},
    {id:"fb-rivers", type:"line", source:"fbv", layout:{visibility:"none","line-cap":"round","line-join":"round"}, paint:{"line-color":"#a9bccb","line-width":3.5}},
    {id:"fb-rail", type:"line", source:"fbr", layout:{visibility:"none"}, paint:{"line-color":"#8d9499","line-width":1.6}},
    {id:"low-fill", type:"fill", source:"low", layout:{visibility:hoodOn}, paint:{"fill-color":"#4a7096","fill-opacity":0.13}},
    {id:"scarp-line", type:"line", source:"scarp", layout:{visibility:hoodOn,"line-cap":"round"}, paint:{"line-color":"#9E7B4F","line-width":2.2,"line-dasharray":[2,2]}},
    {id:"route-casing", type:"line", source:"routes", layout:{"line-cap":"round","line-join":"round"},
      paint:{"line-color":"#ffffff","line-width":["interpolate",["linear"],["zoom"],11,3.5,16,9]}},
    {id:"route-line", type:"line", source:"routes", layout:{"line-cap":"round","line-join":"round"},
      paint:{"line-color":"#1F6F78","line-width":["interpolate",["linear"],["zoom"],11,1.8,16,5]}},
    {id:"route-hit", type:"line", source:"routes", paint:{"line-color":"#000","line-opacity":0,"line-width":22}},
    {id:"plan-line", type:"line", source:"plan", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"#181D24","line-width":2.5,"line-dasharray":[1,1.6]}}
  ];
  let at = s.layers.findIndex(l => l.type === "symbol");       // keep my overlays under the map's own labels
  if (at < 0) at = s.layers.length;
  s.layers.splice(at, 0, ...mine);
  s.layers.push({id:"route-label", type:"symbol", source:"routes", minzoom:13,
    layout:{"symbol-placement":"line", "text-field":["get","label"], "text-font":["Noto Sans Bold"], "text-size":12.5, "symbol-spacing":320, "text-max-angle":70, "text-keep-upright":true},
    paint:{"text-color":"#1F6F78", "text-halo-color":"rgba(255,255,255,0.95)", "text-halo-width":1.6}});
  return s;
}
function initMap(){
  if (map) return true;
  if (!window.maplibregl){ mapNote("The map library did not load. Check the connection and reload. Lists, Near me and directions still work."); return false; }
  try {
    map = new maplibregl.Map({container:"map", style:buildStyle(), center:[139.70, 35.688], zoom:10.6, minZoom:8, maxZoom:19,
      dragRotate:false, pitchWithRotate:false, attributionControl:{compact:true}});
  } catch (err){
    map = null; mapNote("This browser could not start the map. Lists, Near me and directions still work."); return false;
  }
  try { map.touchZoomRotate.disableRotation(); } catch(e){}
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");
  geoCtl = new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}, trackUserLocation:true});
  map.addControl(geoCtl, "top-right");
  geoCtl.on("geolocate", e => { if (e && e.coords){ here = {la:e.coords.latitude, lo:e.coords.longitude}; if (st.view === "near") renderNear(); if (sel) renderSheet(); } });
  map.on("error", () => {});
  map.on("data", e => { if (!baseOK && e && e.sourceId === "openmaptiles" && e.tile){ baseOK = true; setFallback(false); } });
  map.on("zoom", zoomClass);
  map.on("mousemove", e => { map.getCanvas().style.cursor = routeAt(e.point) ? "pointer" : ""; });
  map.on("click", e => {
    const t = e && e.originalEvent && e.originalEvent.target;
    if (fixing || (t && t.closest && t.closest(".pin"))) return;
    const l = routeAt(e.point);
    if (l && P[l.p]){ select(l.p); return; }
    if (sel) select(null);
  });
  setTimeout(() => { if (!baseOK) setFallback(true); }, 7000);
  zoomClass();
  syncMarkers();
  return true;
}
function setFallback(on){
  fallbackOn = on;
  mapNote(on ? "No street map here yet, only ward outlines. It loads when the page is online at its own web address. Tap to hide." : "");
  applyOverlays();
}
function zoomClass(){ if (!map) return; const z = map.getZoom(); $("#map").dataset.z = z < 11.8 ? "lo" : z < 15.2 ? "mid" : "hi"; }
function applyOverlays(tries){
  if (!map) return;
  try {
    const hoodOn = st.on.includes("hood") ? "visible" : "none";
    map.setLayoutProperty("low-fill", "visibility", hoodOn);
    map.setLayoutProperty("scarp-line", "visibility", hoodOn);
    const rs = map.getSource("routes"); if (rs) rs.setData(routesGeo());
    FB_LAYERS.forEach(id => map.setLayoutProperty(id, "visibility", fallbackOn ? "visible" : "none"));
    const src = map.getSource("plan"); if (src) src.setData(planGeo());
  } catch (e){
    if ((tries || 0) < 12) setTimeout(() => applyOverlays((tries || 0) + 1), 400);   // style not ready yet
  }
}
function pinEl(p){
  const el = document.createElement("button");
  el.type = "button";
  el.className = "pin " + shapeOf(p) + (isApprox(p) ? " approx" : "");
  el.style.setProperty("--c", p.C.color);
  el.setAttribute("aria-label", p.n);
  if (p.hl){
    el.className = "pin hl";
    el.innerHTML = "<i>" + p.num + '</i><span class="lab">' + esc(p.n) + "</span>";
    el.addEventListener("click", ev => { ev.stopPropagation(); if (fixing) return; if (sel === p.hl) focusRow(p); else select(p.id); });
    return el;
  }
  el.innerHTML = p.area ? '<span class="pl">' + esc(p.sn || p.n) + "</span>" : '<i></i><span class="lab">' + esc(p.n) + "</span>";
  el.addEventListener("click", ev => { ev.stopPropagation(); if (!fixing) select(sel === p.id ? null : p.id, !!HL[p.id] && sel !== p.id); });
  return el;
}
function addMarker(key, el, la, lo){
  const label = el.getAttribute("aria-label");
  const m = new maplibregl.Marker({element:el, anchor:"center"}).setLngLat([lo, la]).addTo(map);
  if (label) el.setAttribute("aria-label", label);        // the library replaces it with "Map marker"
  markers.set(key, m);
}
function syncMarkers(){
  if (!map) return;
  const want = new Set(visiblePlaces().map(p => p.id));
  plan.forEach(id => want.add(id));
  if (sel){ want.add(sel); (HL[sel] || []).forEach(q => want.add(q.id)); }
  markers.forEach((m, key) => { const id = key.split("|")[0]; if (!want.has(id)){ m.remove(); markers.delete(key); } });
  want.forEach(id => {
    const p = P[id];
    if (!markers.has(id)){ const a = pos(p); addMarker(id, pinEl(p), a[0], a[1]); }
    (p.pts || []).forEach((q, i) => {
      const key = id + "|" + i;
      if (markers.has(key)) return;
      const el = document.createElement("button");
      el.type = "button"; el.className = "pin sub"; el.style.setProperty("--c", p.C.color); el.setAttribute("aria-label", q[0]);
      el.innerHTML = '<i></i><span class="lab">' + esc(q[0]) + "</span>";
      el.addEventListener("click", ev => { ev.stopPropagation(); if (!fixing) select(p.id); });
      addMarker(key, el, q[1], q[2]);
    });
  });
  markers.forEach((m, key) => {
    if (key.indexOf("|") >= 0) return;
    const el = m.getElement(), n = plan.indexOf(key);
    el.classList.toggle("sel", key === sel);
    if (n >= 0) el.dataset.n = n + 1; else delete el.dataset.n;
  });
  renderLegend();
}
function refreshMarker(id){ const m = markers.get(id); if (m){ m.remove(); markers.delete(id); } syncMarkers(); }
function renderLegend(){
  const vis = visiblePlaces();
  let h = "";
  if (vis.some(p => !isApprox(p) && !p.area)) h += '<div><span class="sw" style="--c:#5C6672"></span>At the address</div>';
  if (vis.some(p => isApprox(p))) h += '<div><span class="sw hollow" style="--c:#5C6672"></span>Near here, spot not confirmed</div>';
  if ((DATA.overlay.lines || []).some(l => st.on.includes(l.c))) h += '<div><span class="rv"></span>Rivers and greenways</div>';
  if (st.on.includes("hood") && !fallbackOn) h += '<div><span class="lo"></span>Low ground</div><div><span class="ln"></span>Plateau edge, roughly</div>';
  const l = $("#legend"); l.innerHTML = h; l.hidden = !h || !!sel || !!fixing;
}
function flyTo(p){
  if (!map) return;
  const a = pos(p), sh = $("#sheet"), narrow = window.innerWidth < 900;
  if (HL[p.id]){
    const b = new maplibregl.LngLatBounds(); b.extend([a[1], a[0]]); HL[p.id].forEach(q => b.extend([q.lo, q.la]));
    const pad = narrow && !sh.hidden ? {top:50, left:40, right:110, bottom:Math.min(sh.offsetHeight, 420) + 20} : {top:60, left:60, right:narrow ? 110 : 460, bottom:50};
    try { map.fitBounds(b, {padding:pad, maxZoom:16, duration:650}); return; } catch(e){}
  }
  const off = sh.hidden ? [0, 0] : narrow ? [0, -Math.min(sh.offsetHeight, 300)/2] : [-Math.min(sh.offsetWidth, 400)/2, 0];
  try { map.easeTo({center:[a[1], a[0]], zoom:Math.max(map.getZoom(), p.area ? 13.6 : 15.4), offset:off, duration:650}); } catch(e){}
}
function fitMap(){ if (map) try { map.resize(); } catch(e){} }
function showMap(){ st.view = "map"; renderTop(); initMap(); fitMap(); }

/* ---------------- selection sheet ---------------- */
function select(id, fly){
  sel = id && P[id] ? id : null;
  renderSheet();
  syncMarkers();
  if (sel && fly) flyTo(P[sel]);
}
function renderSheet(){
  const sh = $("#sheet");
  if (!sel){ sh.hidden = true; sh.innerHTML = ""; renderLegend(); return; }
  const p = P[sel], a = pos(p), ap = isApprox(p), inPlan = plan.includes(p.id);
  let h = '<button class="x" data-act="close" aria-label="Close">×</button>';
  h += '<p class="kind">' + swatch(p) + "<b>" + esc(p.C.label) + "</b>" + (p.g && p.G.id !== "food" ? "<span>" + esc(p.g) + "</span>" : "") + (p.nw ? '<span class="tagnew">New on the list</span>' : "") + "</p>";
  h += "<h2>" + esc(p.n) + "</h2>";
  if (p.j && p.G.id === "food") h += '<p class="ja" lang="ja">' + esc(p.j) + "</p>";
  let f = "";
  if (p.s) f += "<dt>Station</dt><dd>" + esc(stationTxt(p)) + (p.G.id === "food" && p.g ? ", " + esc(p.g) : "") + "</dd>";
  const ct = closedTxt(p);
  if (ct) f += "<dt>Hours</dt><dd>" + esc(ct) + (shutToday(p) ? ' <span class="shut">Closed today</span>' : "") + "</dd>";
  if (p.ad) f += '<dt>Address</dt><dd lang="ja">' + esc(p.ad) + "</dd>";
  if (here){ const m = metres(here.la, here.lo, a[0], a[1]), w = walkTxt(ap ? Math.max(m, 240) : m); f += "<dt>From you</dt><dd>" + (ap ? "about " : "") + w[0] + " " + w[1] + "</dd>"; }
  if (f) h += '<dl class="facts">' + f + "</dl>";
  if (p.d) h += '<p class="note">' + esc(p.d) + "</p>";
  if (ap) h += '<div class="approxbox" style="--c:' + p.C.color + '"><span>This pin is a best guess near ' + esc(p.s || "the area") + '. The Maps buttons search by name to find the real spot.</span><button class="btn small line" data-act="fix" data-id="' + p.id + '">Set the exact spot</button></div>';
  else if (fixes[p.id]) h += '<div class="approxbox"><span>You placed this pin yourself.</span><button class="btn small line" data-act="unfix" data-id="' + p.id + '">Undo</button></div>';
  const verb = ap && !p.area ? "Find in " : "Directions in ";
  h += '<div class="acts">' +
    '<a class="btn" target="_blank" rel="noopener" href="' + esc(googleUrl(p)) + '">' + verb + "Google Maps</a>" +
    '<a class="btn" target="_blank" rel="noopener" href="' + esc(appleUrl(p)) + '">' + verb + "Apple Maps</a>" +
    '<button class="btn line wide" data-act="plan" data-id="' + p.id + '">' + (inPlan ? "Remove from plan" : "Add to plan") + "</button></div>";
  let l = "";
  if (st.view !== "map" && window.innerWidth < 900) l += '<button data-act="show" data-id="' + p.id + '">Show on map</button>';
  if (!p.area && !ap) l += '<a target="_blank" rel="noopener" href="' + esc(lookupUrl(p)) + '">Look up on Google</a>';
  if (p.u) l += '<a target="_blank" rel="noopener" href="https://tabelog.com/en/tokyo/' + esc(p.u) + '/">Tabelog</a>';
  if (p.w) l += '<a target="_blank" rel="noopener" href="' + esc(p.w) + '">Website</a>';
  if (l) h += '<div class="links">' + l + "</div>";
  if (p.hl) h += '<div class="links"><button data-act="open" data-id="' + p.hl + '">More in ' + esc(P[p.hl].n) + "</button></div>";
  if (p.hi) h += '<ul class="hi">' + p.hi.map((x, k) => {
    const rt = (DATA.overlay.lines || []).find(l => l.p === p.id && l.n === x[0]);
    const pins = (HL[p.id] || []).filter(q => q.row === k);
    let t = '<li data-row="' + k + '">' + (pins.length ? '<span class="num">' + pins[0].num + "</span>" : "") + "<b>" + esc(x[0]) + "</b><span>" + esc(x[1]) + "</span>";
    if (rt) t += '<button class="btn small line" style="margin:6px 10px 2px 0" data-act="route" data-id="' + rt.id + '">Show the route</button>';
    if (pins.length) t += pins.map(q => '<div class="pinrow">' + (pins.length > 1 ? "<em>" + esc(q.n) + "</em>" : "") +
        '<button data-act="hl" data-id="' + q.id + '">Show on map</button>' +
        '<a target="_blank" rel="noopener" href="' + esc(googleUrl(q)) + '">Google Maps</a>' +
        '<a target="_blank" rel="noopener" href="' + esc(appleUrl(q)) + '">Apple Maps</a>' +
        '<button data-act="plan" data-id="' + q.id + '">' + (plan.includes(q.id) ? "In plan ✓" : "Add to plan") + "</button></div>").join("");
    else if (!rt) t += '<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + enc(x[0].replace(/\s*\(.*?\)\s*/g, " ").trim() + " Tokyo") + '">Find in Google Maps</a>';
    else t += '<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + enc(rt.j || rt.n) + '">Find in Google Maps</a>';
    return t + "</li>"; }).join("") + "</ul>";
  sh.innerHTML = h; sh.hidden = false; sh.scrollTop = 0;
  renderLegend();
}

/* ---------------- list ---------------- */
function groupsFor(g, places){
  const m = new Map();
  places.forEach(p => { const k = p.g || "Other"; if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
  let keys = [...m.keys()];
  if (g.groups) keys.sort((a, b) => (g.groups.indexOf(a) + 1 || 99) - (g.groups.indexOf(b) + 1 || 99));
  else keys.sort((a, b) => m.get(b).length - m.get(a).length || a.localeCompare(b));
  return keys.map(k => [k, m.get(k)]);
}
function rowHtml(p, right){
  const sub = [];
  if (p.j && p.G.id === "food") sub.push('<span lang="ja">' + esc(p.j) + "</span>");
  if (p.s) sub.push(esc(p.s));
  if (shutToday(p)) sub.push('<span class="shut">Closed today</span>');
  return '<button class="row" data-act="open" data-id="' + p.id + '">' + swatch(p) + '<span class="t"><span class="nm">' + esc(p.n) +
    (p.nw ? '<span class="tagnew">New</span>' : "") + '</span><span class="sub2">' + sub.join(", ") + "</span></span>" + (right || "") + "</button>";
}
function renderList(){
  const g = GUIDE[st.guide], q = st.q.trim().toLowerCase();
  const hasHours = g.places.some(p => p.cl);
  let ps = visiblePlaces(g.id);
  const total = ps.length;
  if (q) ps = ps.filter(p => (p.n + " " + (p.j || "") + " " + (p.s || "") + " " + (p.g || "")).toLowerCase().includes(q));
  if (st.openOnly && hasHours) ps = ps.filter(p => !shutToday(p));
  let h = '<h1 class="title">' + esc(g.label) + '</h1><div class="tools"><input type="search" id="q" placeholder="Search name, station or area" aria-label="Search" value="' + esc(st.q) + '">' +
    (hasHours ? '<button class="tgl" data-act="openOnly" aria-pressed="' + st.openOnly + '">Open today</button>' : "") + "</div>";
  if (!total) h += '<div class="empty"><b>No layers are switched on for ' + esc(g.label) + '</b>Tap a layer above to list its places and put them on the map.</div>';
  else {
    h += '<p class="tally">' + ps.length + (ps.length === total ? "" : " of " + total) + " places" + (st.openOnly && hasHours ? ", by Tokyo's calendar today (" + DAY[TOKYO_DAY] + ")" : "") + "</p>";
    if (!ps.length) h += '<div class="empty"><b>Nothing matches</b>Clear the search or the open-today filter.</div>';
    groupsFor(g, ps).forEach(([k, arr]) => {
      h += '<div class="grp">' + esc(k) + "<small>" + arr.length + "</small></div>" + arr.map(p => rowHtml(p)).join("");
    });
    h += '<div class="foot"><button class="btn small line" data-act="export" data-what="list">Export these ' + ps.length + " places for other map apps</button></div>";
  }
  $("#listBody").innerHTML = h;
  const inp = $("#q");
  if (inp) inp.addEventListener("input", () => { st.q = inp.value; const at = inp.selectionStart; renderList(); const n = $("#q"); n.focus(); try { n.setSelectionRange(at, at); } catch(e){} });
}

/* ---------------- near me ---------------- */
function originPoint(){
  if (st.origin && st.origin.t === "st" && ST[st.origin.id]) return {la:ST[st.origin.id].la, lo:ST[st.origin.id].lo, label:st.origin.id + " station"};
  if (here) return {la:here.la, lo:here.lo, label:"your location"};
  return null;
}
function renderNear(){
  const o = originPoint();
  const names = Object.keys(ST).sort();
  let h = '<h1 class="title">Near me</h1><p class="lede">Everything on the layers you have switched on, across all three guides, nearest first.</p>' +
    '<div class="tools"><button class="tgl" data-act="locate" aria-pressed="' + (!!here && !(st.origin && st.origin.t === "st")) + '">Use my location</button>' +
    '<select id="stn" aria-label="Or start from a station"><option value="">or start from a station</option>' +
    names.map(n => '<option value="' + esc(n) + '"' + (st.origin && st.origin.t === "st" && st.origin.id === n ? " selected" : "") + ">" + esc(n) + " " + esc(ST[n].ja) + "</option>").join("") + "</select></div>" +
    '<div class="tools"><button class="tgl" data-act="nearAll" data-v="0" aria-pressed="' + !st.nearAll + '">Layers that are on</button><button class="tgl" data-act="nearAll" data-v="1" aria-pressed="' + !!st.nearAll + '">Everything</button></div>';
  if (nearMsg) h += '<p class="tally">' + esc(nearMsg) + "</p>";
  if (!o) h += '<div class="empty"><b>Where are you starting from?</b>Use your location, or pick a station to plan ahead.</div>';
  else {
    let ps = st.nearAll ? Object.values(P) : visiblePlaces();
    if (st.nearAll){                     // a highlight that is also a shop or venue elsewhere appears once
      const real = ps.filter(p => !p.hl);
      ps = ps.filter(p => !p.hl || !real.some(q => metres(p.la, p.lo, pos(q)[0], pos(q)[1]) < 40));
    }
    if (!ps.length) h += '<div class="empty"><b>No layers are switched on</b>Switch some on above, or choose Everything.</div>';
    else {
      const arr = ps.map(p => { const a = pos(p), m = metres(o.la, o.lo, a[0], a[1]); return [isApprox(p) ? Math.max(m, 240) : m, p]; }).sort((x, y) => x[0] - y[0]).slice(0, 60);
      h += '<div class="grp">From ' + esc(o.label) + "<small>straight-line estimates</small></div>";
      h += arr.map(([m, p]) => { const ap = isApprox(p), w = walkTxt(m); return rowHtml(p, '<span class="r"><b>' + (ap ? "~" : "") + w[0] + "</b>" + w[1] + "</span>"); }).join("");
    }
  }
  $("#nearBody").innerHTML = h;
  const s = $("#stn");
  if (s) s.addEventListener("change", () => { st.origin = s.value ? {t:"st", id:s.value} : null; nearMsg = ""; save(); renderNear(); });
}
function locate(){
  if (!navigator.geolocation){ nearMsg = "This browser does not share location."; renderNear(); return; }
  nearMsg = "Finding you…"; renderNear();
  navigator.geolocation.getCurrentPosition(g => {
    here = {la:g.coords.latitude, lo:g.coords.longitude}; st.origin = {t:"gps"}; nearMsg = ""; save(); renderNear();
  }, () => { nearMsg = "Location is off or blocked for this page. Allow it in the browser's settings, or pick a station."; renderNear(); },
  {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
}

/* ---------------- plan ---------------- */
function renderPlan(){
  let h = '<h1 class="title">Plan</h1><p class="lede">Collect stops from any guide, put them in walking order, then hand the route to Google Maps.</p>';
  if (!plan.length) h += '<div class="empty"><b>No stops yet</b>Open any place and choose Add to plan.</div>';
  else {
    plan.forEach((id, i) => {
      const p = P[id];
      if (i){ const a = pos(P[plan[i-1]]), b = pos(p), w = walkTxt(metres(a[0], a[1], b[0], b[1])); h += '<div class="leg">' + (w[0] === "Here" ? "A few steps" : w[0] + " " + w[1]) + "</div>"; }
      h += '<div class="planrow"><span class="num">' + (i+1) + '</span><button class="t" data-act="open" data-id="' + id + '"><span class="nm" style="font-weight:500">' + esc(p.n) + '</span><span class="sub2" style="display:block;font-size:12.5px;color:var(--soft)">' +
        esc(p.C.label) + (p.s ? ", " + esc(p.s) : "") + (isApprox(p) ? ", spot not confirmed" : "") + "</span></button>" +
        '<button class="mv" data-act="mv" data-i="' + i + '" data-d="-1" aria-label="Move up"' + (i ? "" : " disabled") + ">↑</button>" +
        '<button class="mv" data-act="mv" data-i="' + i + '" data-d="1" aria-label="Move down"' + (i < plan.length-1 ? "" : " disabled") + ">↓</button>" +
        '<button class="mv" data-act="rm" data-i="' + i + '" aria-label="Remove">×</button></div>';
    });
    h += '<div class="acts"><a class="btn wide" target="_blank" rel="noopener" href="' + esc(routeUrl(plan)) + '">Open walking route in Google Maps</a>' +
      '<button class="btn line" data-act="planMap">Show on map</button><button class="btn line" data-act="export" data-what="plan">Export plan</button>' +
      '<button class="btn line wide" data-act="planClear">Clear the plan</button></div>' +
      '<p class="tally">The route starts from wherever you are when you open it.' + (plan.length > 10 ? " Google Maps takes about ten stops per route, so split a longer day in two." : "") +
      (plan.some(id => isApprox(P[id])) ? " Stops without a confirmed spot are passed by name, so check Google picked the right place." : "") + "</p>";
  }
  $("#planBody").innerHTML = h;
}

/* ---------------- read ---------------- */
function renderRead(){
  const g = GUIDE[st.guide];
  const tot = Object.values(P), ex = tot.filter(p => !isApprox(p)).length;
  $("#readBody").innerHTML = '<h1 class="title">' + esc(g.label) + "</h1>" + g.read +
    "<h2>Take the pins elsewhere</h2><p>Export gives you a KML file. Organic Maps (free, works offline) opens it straight from the share sheet. For Google, import it at google.com/mymaps and it shows up in the Google Maps app under your saved maps. Apple Maps has no import, so use the direction buttons instead.</p>" +
    '<div class="foot" style="margin-top:8px"><button class="btn small line" data-act="export" data-what="guide">Export ' + esc(g.label) + '</button><button class="btn small line" data-act="export" data-what="on">Export layers that are on</button><button class="btn small line" data-act="export" data-what="all">Export everything</button></div>' +
    '<div class="about"><p>' + tot.length + " places, " + ex + " pinned at their address and " + (tot.length - ex) + " as a best guess (hollow pins). Built " + esc(DATA.built) + ".</p>" +
    "<p>Shop positions come from OpenStreetMap (© OpenStreetMap contributors, ODbL) and a community-compiled index of the Tabelog Hyakumeiten lists. Base map © OpenStreetMap contributors, tiles by OpenFreeMap.</p></div>";
}

/* ---------------- export ---------------- */
const OM = {bread:["red","ff2e3ab2"], ramen:["orange","ff1a86e0"], coffee:["brown","ff2f4a6b"], sushi:["blue","ff8a5c2a"], pizza:["green","ff50732e"],
  okonomiyaki:["lime","ff1e8c8a"], venue:["purple","ffa03f7b"], records:["pink","ff7a32c4"], hood:["teal","ff786f1f"]};
function kml(title, places){
  const x = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const used = [...new Set(places.map(p => p.c))];
  let s = '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' + x(title) + "</name>\n";
  used.forEach(c => { const o = OM[c] || ["gray","ff72665c"]; s += '<Style id="placemark-' + o[0] + '"><IconStyle><color>' + o[1] + '</color><Icon><href>https://maps.google.com/mapfiles/kml/paddle/wht-blank.png</href></Icon></IconStyle></Style>\n'; });
  places.forEach(p => {
    const a = pos(p), d = [];
    d.push(p.C.label + (p.s ? ", near " + p.s + " station" : ""));
    if (p.j) d.push(p.j);
    if (isApprox(p)) d.push("Approximate position: search by name for the exact spot.");
    const ct = closedTxt(p); if (ct) d.push(ct);
    if (p.d) d.push(p.d);
    if (p.u) d.push("https://tabelog.com/en/tokyo/" + p.u + "/");
    if (p.w) d.push(p.w);
    s += "<Placemark><name>" + x(p.n + (isApprox(p) ? " (approx.)" : "")) + "</name><description>" + x(d.join("\n")) + "</description><styleUrl>#placemark-" + (OM[p.c] || ["gray"])[0] +
      "</styleUrl><Point><coordinates>" + a[1] + "," + a[0] + ",0</coordinates></Point></Placemark>\n";
  });
  return s + "</Document></kml>\n";
}
async function saveFile(name, text){
  const type = "application/vnd.google-earth.kml+xml";
  try {
    if (window.matchMedia && matchMedia("(pointer:coarse)").matches && navigator.canShare && typeof File === "function"){
      const f = new File([text], name, {type});
      if (navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
    }
  } catch (e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function exportWhat(what){
  const g = GUIDE[st.guide];
  let ps, title;
  if (what === "plan"){ ps = plan.map(id => P[id]); title = "Tokyo plan"; }
  else if (what === "all"){ ps = Object.values(P); title = "Tokyo field guide"; }
  else if (what === "guide"){ ps = g.places.concat(hlOf(g.places)); title = "Tokyo " + g.label.toLowerCase(); }
  else if (what === "on"){ ps = visiblePlaces(); ps = ps.concat(hlOf(ps)); title = "Tokyo " + st.on.map(id => CAT[id].label.toLowerCase()).join(" + "); }
  else { ps = visiblePlaces(g.id); ps = ps.concat(hlOf(ps)); title = "Tokyo " + g.cats.filter(c => st.on.includes(c.id)).map(c => c.label.toLowerCase()).join(" + "); }
  if (!ps.length) return;
  saveFile(title.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".kml", kml(title, ps));
}

/* ---------------- pin fixing ---------------- */
function startFix(id){
  fixing = id; const p = P[id];
  showMap(); sel = null; renderSheet(); syncMarkers();
  if (!map){ fixing = null; return; }
  const a = pos(p);
  try { map.jumpTo({center:[a[1], a[0]], zoom:Math.max(map.getZoom(), 16.5)}); } catch(e){}
  $("#cross").hidden = false; $("#fixbar").hidden = false; renderLegend();
}
function endFix(saveIt){
  const id = fixing; fixing = null;
  $("#cross").hidden = true; $("#fixbar").hidden = true;
  if (saveIt && map && id){ const c = map.getCenter(); fixes[id] = [+c.lat.toFixed(6), +c.lng.toFixed(6)]; save(); }
  if (id){ refreshMarker(id); select(id); }
}

/* ---------------- actions ---------------- */
function render(){
  renderTop();
  if (st.view === "list") renderList();
  if (st.view === "near") renderNear();
  if (st.view === "plan") renderPlan();
  if (st.view === "read") renderRead();
  if (st.view === "map" || window.innerWidth >= 900){ initMap(); fitMap(); }
  syncMarkers(); applyOverlays(); save();
}
function routeAt(pt){                   // the route under a tap, measured on screen so it works before tiles load
  if (!map || !pt) return null;
  let best = null, bd = 14;
  (DATA.overlay.lines || []).forEach(l => {
    if (!st.on.includes(l.c)) return;
    let prev = null;
    l.coords.forEach(c => {
      const q = map.project(c);
      if (prev){
        const dx = q.x - prev.x, dy = q.y - prev.y, L = dx*dx + dy*dy;
        const t = L ? Math.max(0, Math.min(1, ((pt.x - prev.x)*dx + (pt.y - prev.y)*dy) / L)) : 0;
        const d = Math.hypot(pt.x - prev.x - t*dx, pt.y - prev.y - t*dy);
        if (d < bd){ bd = d; best = l; }
      }
      prev = q;
    });
  });
  return best;
}
function showRoute(id){
  const l = (DATA.overlay.lines || []).find(x => x.id === id); if (!l) return;
  if (!st.on.includes(l.c)) st.on.push(l.c);
  showMap(); render();
  if (!map) return;
  const b = new maplibregl.LngLatBounds(); l.coords.forEach(c => b.extend(c));
  const narrow = window.innerWidth < 900, sh = $("#sheet");
  const pad = narrow && !sh.hidden ? {top:60, left:30, right:60, bottom:Math.min(sh.offsetHeight, 420) + 30} : {top:70, left:50, right:narrow ? 60 : 440, bottom:60};
  try { map.fitBounds(b, {padding:pad, maxZoom:16, duration:600}); } catch(e){}
}
function focusRow(q){                  // a highlight pin was tapped while its neighborhood is open
  const li = document.querySelector('#sheet li[data-row="' + q.row + '"]');
  if (!li) return;
  li.scrollIntoView({block:"nearest", behavior:"smooth"});
  li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash");
}
function showHighlight(id){
  const q = P[id]; if (!q) return;
  if (sel !== q.hl && sel !== q.id) select(q.hl);
  showMap(); syncMarkers();
  const m = markers.get(q.id), el = m && m.getElement();
  if (el){ el.classList.remove("ping"); void el.offsetWidth; el.classList.add("ping"); }
  if (!map) return;
  const sh = $("#sheet"), narrow = window.innerWidth < 900;
  const off = sh.hidden ? [0, 0] : narrow ? [0, -Math.min(sh.offsetHeight, 300)/2] : [-Math.min(sh.offsetWidth, 400)/2, 0];
  try { map.easeTo({center:[q.lo, q.la], zoom:Math.max(map.getZoom(), 16), offset:off, duration:600}); } catch(e){}
}
const ACT = {
  hl(d){ showHighlight(d.id); },
  route(d){ showRoute(d.id); },
  guide(d){ st.guide = d.id; st.q = ""; render(); },
  view(d){ if (fixing) endFix(false); st.view = d.id; render(); if (sel) renderSheet(); },
  layer(d){ const i = st.on.indexOf(d.id); if (i >= 0) st.on.splice(i, 1); else st.on.push(d.id); render(); },
  layerAll(d){ const ids = GUIDE[st.guide].cats.map(c => c.id); st.on = st.on.filter(id => !ids.includes(id)); if (d.all === "1") st.on = st.on.concat(ids); render(); },
  open(d){ select(d.id, st.view === "map" || window.innerWidth >= 900); },
  show(d){ showMap(); save(); select(d.id, true); },
  close(){ select(null); },
  plan(d){ const i = plan.indexOf(d.id); if (i >= 0) plan.splice(i, 1); else plan.push(d.id); const top = $("#sheet").scrollTop; render(); renderSheet(); $("#sheet").scrollTop = top; },
  mv(d){ const i = +d.i, j = i + (+d.d); if (j < 0 || j >= plan.length) return; const t = plan[i]; plan[i] = plan[j]; plan[j] = t; render(); },
  rm(d){ plan.splice(+d.i, 1); render(); },
  planClear(){ plan = []; render(); },
  planMap(){
    showMap(); save(); syncMarkers(); applyOverlays();
    if (map && plan.length){
      const b = new maplibregl.LngLatBounds();
      plan.forEach(id => { const a = pos(P[id]); b.extend([a[1], a[0]]); });
      try { map.fitBounds(b, {padding:70, maxZoom:16, duration:500}); } catch(e){}
    }
  },
  openOnly(){ st.openOnly = !st.openOnly; render(); },
  nearAll(d){ st.nearAll = d.v === "1"; render(); },
  locate(){ st.origin = {t:"gps"}; locate(); },
  export(d){ exportWhat(d.what); },
  fix(d){ startFix(d.id); },
  unfix(d){ delete fixes[d.id]; save(); refreshMarker(d.id); select(d.id); },
  fixSave(){ endFix(true); },
  noteClose(){ mapNote(""); },
  fixCancel(){ endFix(false); }
};
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-act]");
  if (!b || !ACT[b.dataset.act]) return;
  ACT[b.dataset.act](b.dataset, e);
});
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (fixing) endFix(false); else if (sel) select(null); } });
window.addEventListener("resize", fitMap);
render();
</script>
</body>
</html>
